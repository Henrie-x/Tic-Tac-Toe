<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1 class="title">Tic Tac Toe</h1>
    <div class="mode-toggle">
      <div class="mode-btn active">Play vs Computer</div>
      <div class="mode-btn">Play vs Human</div>
    </div>
    <div class="board">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
    <div class="status">
      Player
      <span>X</span>
      's turn
    </div>
    <button class="restart-btn">Restart game</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
